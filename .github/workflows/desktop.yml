name: Windows desktop build
on:
  workflow_dispatch:
  push:
    branches: [main, feat/desktop]
    paths: ["frontend/**", "scripts/package_desktop.mjs", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["frontend/**", "scripts/package_desktop.mjs", ".github/workflows/desktop.yml"]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:desktop
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm desktop:build
        if: github.event_name != 'pull_request'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - run: node ../scripts/package_desktop.mjs
        if: github.event_name != 'pull_request'
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: finesub-review-windows
          path: output/desktop-*/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: desktop-build-evidence
          path: |
            frontend/src-tauri/Cargo.lock
            frontend/src-tauri/target/release/finesub-review-desktop.exe
