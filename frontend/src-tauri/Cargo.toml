[package]
name = "finesub-review-desktop"
version = "0.2.1"
edition = "2021"
rust-version = "1.90"
description = "FineSub 知识库审核桌面客户端"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "~2.7.0"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
